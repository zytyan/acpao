name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }} executable
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            filename: acpao.exe
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            filename: acpao
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            filename: acpao
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/gateway-go/go.mod
          cache-dependency-path: apps/gateway-go/go.sum
      - run: npm ci
      - run: npm run build:binary
      - name: Test Windows Gateway batch wrappers
        if: runner.os == 'Windows'
        working-directory: apps/gateway-go
        run: go test -run '^TestWindowsBatchAgent$' .
      - name: Smoke test executable
        shell: bash
        run: |
          ./sea-build/${{ matrix.filename }} --acpao-build-info
          node scripts/sea/smoke.mjs sea-build/${{ matrix.filename }}
          if [ "${{ matrix.platform }}" = linux ]; then ldd sea-build/acpao | tee sea-build/system-libraries.txt; fi
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p release
          suffix=""
          if [ "${{ matrix.platform }}" = windows ]; then suffix=".exe"; fi
          cp "sea-build/${{ matrix.filename }}" "release/acpao-${{ matrix.platform }}-${{ matrix.arch }}${suffix}"
          cp "sea-build/gateways/acpao-gateway-${{ matrix.platform }}-${{ matrix.arch }}${suffix}" "release/acpao-gateway-${{ matrix.platform }}-${{ matrix.arch }}${suffix}"
          "release/acpao-gateway-${{ matrix.platform }}-${{ matrix.arch }}${suffix}" --version
          if [ "${{ matrix.platform }}" = windows ]; then
            (cd apps/gateway-go && CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui' -o "$GITHUB_WORKSPACE/release/acpao-open-${{ matrix.platform }}-${{ matrix.arch }}${suffix}" ./launcher)
          else
            (cd apps/gateway-go && CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "$GITHUB_WORKSPACE/release/acpao-open-${{ matrix.platform }}-${{ matrix.arch }}" ./launcher)
          fi
          if [ "${{ matrix.platform }}" = linux ]; then chmod +x release/*; fi
      - uses: actions/upload-artifact@v4
        with:
          name: acpao-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: acpao-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/*
