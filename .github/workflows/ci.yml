name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/gateway-go/go.mod
          cache-dependency-path: apps/gateway-go/go.sum
      - run: npm ci
      - name: Build Go Gateway
        shell: bash
        working-directory: apps/gateway-go
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          CGO_ENABLED=0 go build -buildvcs=false -o "$GITHUB_WORKSPACE/gateway-go$suffix" .
          CGO_ENABLED=0 go build -buildvcs=false -o "$GITHUB_WORKSPACE/acpao-launcher$suffix" ./launcher
          "$GITHUB_WORKSPACE/gateway-go$suffix" --version
          if [ "$RUNNER_OS" != Windows ]; then echo "GO_GATEWAY_BIN=$GITHUB_WORKSPACE/gateway-go$suffix" >> "$GITHUB_ENV"; fi
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        run: npm test
        shell: pwsh
