name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/gateway-go/go.mod
          cache-dependency-path: apps/gateway-go/go.sum
      - run: npm ci
        if: runner.os != 'Windows'
      - name: Smoke test Windows source launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PORT = '0'
          $env:ACPAO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'acpao-source-data'
          $stdout = Join-Path $env:RUNNER_TEMP 'acpao-source-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'acpao-source-stderr.log'
          $launcher = Start-Process $env:ComSpec -ArgumentList '/d /c start.bat --no-browser' `
            -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddMinutes(4)
            do {
              $output = Get-Content $stdout -Raw
              if ($output -match '(?m)^http://127\.0\.0\.1:(\d+)/#launch=[A-Za-z0-9_-]+\s*$') {
                $page = Invoke-WebRequest "http://127.0.0.1:$($Matches[1])/" -TimeoutSec 10
                if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'id="root"') {
                  throw 'Source launcher did not serve the built web UI.'
                }
                return
              }
              if ($launcher.HasExited) { break }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            Get-Content $stderr
            throw 'Source launcher did not print an authorized URL.'
          } finally {
            if (!$launcher.HasExited) { taskkill /PID $launcher.Id /T /F | Out-Null }
          }
      - name: Build Go Gateway
        shell: bash
        working-directory: apps/gateway-go
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          CGO_ENABLED=0 go build -buildvcs=false -o "$GITHUB_WORKSPACE/gateway-go$suffix" .
          CGO_ENABLED=0 go build -buildvcs=false -o "$GITHUB_WORKSPACE/acpao-launcher$suffix" ./launcher
          "$GITHUB_WORKSPACE/gateway-go$suffix" --version
          if [ "$RUNNER_OS" != Windows ]; then echo "GO_GATEWAY_BIN=$GITHUB_WORKSPACE/gateway-go$suffix" >> "$GITHUB_ENV"; fi
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        run: npm test
        shell: pwsh
